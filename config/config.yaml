# Pipeline configuration. Secrets never live here — see .env.example.
#
# ${VAR} and ${VAR:-default} are substituted from the environment at load
# time, so any value can be overridden by a GitHub Actions secret or a local
# .env without editing this file.

database:
  path: "data/state.db"

monitoring:
  # auto: use the YouTube Data API when YOUTUBE_API_KEY is set, and fall back
  #       to the public Atom feed otherwise (and when an API call fails)
  # api:  Data API only            rss: Atom feed only
  #
  # The API is primary because the Atom feed returns intermittent 404s from
  # datacenter IPs — i.e. from GitHub Actions runners. Detection costs 1 quota
  # unit per source per check against a free 10,000/day. See docs/LIMITS.md.
  backend: auto
  api_max_results: 25
  feed_url_template: "https://www.youtube.com/feeds/videos.xml?channel_id={channel_id}"
  # Ignore anything older than this on first sight, so enabling a new source
  # does not enqueue its entire recent back catalogue.
  max_age_hours_on_discovery: 72
  request_timeout_seconds: 20
  max_retries: 4
  backoff_base_seconds: 2

processing:
  max_source_duration_minutes: 180
  max_download_size_mb: 2000

download:
  # Licence is a property of each VIDEO, not of the channel, so a
  # rights-cleared CC channel can still contain all-rights-reserved uploads.
  # This check costs 1 quota unit per batch of up to 50 videos.
  #
  # Turning it off means the ONLY rights control left is the per-source
  # rights_cleared flag. Do that only if every enabled source is footage you
  # own outright. See docs/RIGHTS.md.
  require_creative_commons: true

  # Too short to pull a 20-60s self-contained clip out of.
  min_source_duration_seconds: 120

  # A 9:16 crop of a 16:9 source keeps only ~56% of the width, so a 1440p
  # source yields a true 1080-wide vertical frame while 1080p would have to be
  # upscaled. Raise to 2160 for better quality at ~4x the bytes.
  preferred_max_height: 1440

  # YouTube serves one progressive (single-file) format and it is 360p, so
  # anything usable requires muxing separate streams — i.e. FFmpeg. Leave this
  # false: true downloads 360p, which cannot be rendered to 1080x1920 without
  # a 3x upscale the spec forbids. Testing only.
  allow_progressive_only: false

  # Extraction breaks per player client as YouTube pushes back, and which one
  # works changes over time. Verified 2026-10-10: of these, three failed and
  # android_vr worked. Tried in order; reorder here without a code change.
  player_clients: ["default", "android_vr", "tv", "web_safari", "mweb", "ios"]

  max_videos_per_run: 3
  max_retries: 3

  # Empty means a temp directory removed when the command exits. Set a path to
  # keep downloads between commands while developing.
  work_dir: ""

transcription:
  # auto:  Groq when TRANSCRIPTION_API_KEY is set, local Whisper otherwise
  # groq:  Groq only          local: local Whisper only (no key, no quota)
  backend: auto

  # Groq free tier, verified 2026-10-10: 25 MB per upload (the binding
  # constraint), ~28,800 audio seconds/day, 20 req/min, 2,000 req/day.
  groq_model: "whisper-large-v3-turbo"

  # Local fallback. `base` runs at roughly real time on a 4-vCPU runner;
  # `small` is better and 2-3x slower; `tiny` is for tests only.
  local_model: "base"

  # Leave empty to auto-detect. Setting it (e.g. "en") is faster and avoids
  # mis-detection on noisy audio like team radio.
  language: ""

  # 16 kHz mono MP3. Whisper resamples to 16 kHz mono internally and Groq
  # downsamples before transcribing, so higher is bytes spent on information
  # the model discards. At 32 kbit/s, 25 MB holds ~104 minutes, so a
  # 180-minute source is 2 chunks rather than 9.
  bitrate_kbps: 32

  # Chunks overlap by this much, and each chunk owns the span up to the
  # middle of the overlap — so no speech is duplicated and none is dropped
  # at a boundary.
  chunk_overlap_seconds: 4

  # If a Groq attempt fails for a reason that is NOT a spent allowance, fall
  # back to local Whisper. A spent allowance never falls back: quietly
  # spending an hour of CPU every run would hide the problem.
  allow_local_fallback: true

  # Per-word timestamps. ON because without them Whisper's SEGMENT end
  # times are wrong — measured against audio with known timing, an utterance
  # ending at 3.68s was reported as ending at 7.78s, stretched across the
  # following silence. Phase 4 needs accurate boundaries to avoid starting a
  # clip mid-sentence; Phase 5 needs them to synchronise captions.
  word_timestamps: true

  # A bare, comma-separated list of proper nouns the model keeps mishearing.
  # Measured on multi-accent F1 radio, 2026-10-10:
  #   no prompt                       WER 5.5%  ("Leclerc" came out "LeClick")
  #   "Verstappen, Leclerc, Tsunoda." WER 3.6%  ("Leclerc" correct)
  #   a labelled glossary             WER 5.5%  AND `Drivers:"` appeared as
  #                                             literal text in the transcript
  #
  # Whisper treats this as text that PRECEDED the audio, so it continues it
  # stylistically rather than consulting it as a dictionary. Keep it to bare
  # names. No labels, no sentences, no instructions — those get transcribed.
  # Leave empty to send none.
  vocabulary_prompt: ""

  # Rebuild segment boundaries from the word timings rather than trusting
  # the backend's grouping. Measured 2026-10-10: the same speech and model
  # gave 3 segments from a WAV and 1 fifteen-second segment from the
  # 32 kbit/s MP3 this pipeline produces — while the word timings were
  # identical and correct. So grouping is a property of the encoding and not
  # safe to depend on; word timings are.
  resegment_from_words: true
  max_segment_seconds: 8
  max_segment_chars: 180
  pause_threshold_seconds: 0.8

  max_videos_per_run: 2

clip:
  min_duration: 20
  max_duration: 60
  target_duration: 45
  candidates_per_video: 8

analysis:
  # auto: Gemini when LLM_API_KEY is set, the heuristic scorer otherwise
  # llm:  Gemini only (fails loudly with no key, rather than silently
  #       falling back — an explicit choice should error, not degrade)
  # heuristic: never calls an LLM, even with a key present
  backend: auto

  # An alias, not a pinned snapshot. Verified 2026-10-10: the previously
  # obvious default, gemini-2.5-flash, now 404s ("no longer available to
  # new users"). gemini-flash-latest tracks whatever Google currently calls
  # its stable flash tier.
  llm_model: "gemini-flash-latest"

  # Verified 2026-10-10: with responseSchema set, Gemini's OWN default
  # thinking budget spent 283-716 tokens and 12-40s "thinking" about a
  # four-segment transcript, with no measured quality gain over 0 on the
  # cases tried. 0 is a latency/cost choice; re-verify if real transcripts
  # show worse scoring quality than the heuristic fallback.
  thinking_budget: 0

  # A long video can produce far more candidate windows than are worth an
  # LLM call over. Evenly sampled across the timeline if there are more
  # than this, never just the first N.
  max_windows_for_llm: 25

  # Bare, comma-separated proper nouns the model keeps mishearing or that
  # help it recognise who's speaking. Passed as context, not instructions —
  # see transcription.vocabulary_prompt for why the shape matters.
  vocabulary_hint: ""

  # A window is grown by adding segments only while the gap since the last
  # one stays under this — stops a candidate silently swallowing a long
  # dead patch of broadcast (spec section 10: "avoid clips with long pauses").
  max_internal_gap_seconds: 6

  # Two candidates whose spans overlap by at least this fraction of the
  # shorter one are treated as the same moment; only the higher-scored one
  # is kept (spec section 13).
  overlap_threshold: 0.5

  # Jaccard word-set similarity against clips already QUEUED/PUBLISHED from
  # a DIFFERENT video, above which a candidate is dropped as a likely
  # re-telling of something already queued.
  similarity_threshold: 0.6

  # If an LLM call fails for a reason that is NOT a spent quota, fall back
  # to the heuristic scorer rather than failing the video outright. A spent
  # quota never falls back — see transcription's identical policy and why.
  allow_heuristic_fallback: true

  max_videos_per_run: 3
  max_retries: 3

publishing:
  max_per_day: 1
  youtube: true
  instagram: true
  tiktok: true
  # Every platform starts private/unlisted. Flipping this to false is a
  # deliberate act taken after a test upload has been inspected by hand.
  force_private: true

branding:
  enabled: true
  watermark_text: "${BRAND_NAME:-YOUR_CHANNEL_NAME}"
  position: "top_right"

video:
  width: 1080
  height: 1920
  fps: 30
  video_codec: "libx264"
  audio_codec: "aac"

logging:
  level: "${LOG_LEVEL:-INFO}"
  json: false
