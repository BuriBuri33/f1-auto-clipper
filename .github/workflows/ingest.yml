name: ingest

# Download videos that passed the rights gate, transcribe them, and commit
# the transcript.
#
# Download and transcription are ONE job on purpose. The media file is
# hundreds of megabytes: too large to commit, and this runner is destroyed
# when the job ends. So the media exists only inside this run, and anything
# needing it must happen here. Transcribing in a later workflow would mean
# downloading the video a second time.
#
# What survives the run: the transcript (text, committed) and the database
# row. The media is deliberately discarded.
#
# Separate from `monitor` on purpose: monitoring is cheap and reliable,
# ingesting is neither. Keeping them apart means an ingest problem never
# stops new uploads being detected and recorded.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List candidates without fetching anything"
        type: boolean
        default: false

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Generous: local Whisper on `base` runs at roughly real time, so a long
    # source is a long job. Actions minutes are unmetered on public repos.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # --upgrade matters: YouTube breaks extraction and only a newer
        # yt-dlp release fixes it, and a cached old wheel is exactly the
        # failure this prevents. A stale yt-dlp presents as a 403 that looks
        # like an IP block — see docs/LIMITS.md section 7.
        run: |
          pip install -r requirements-transcribe.txt
          pip install --upgrade yt-dlp

      - name: Confirm FFmpeg is present
        # Preinstalled on GitHub-hosted ubuntu images, but assert it rather
        # than discover its absence halfway through a download.
        run: ffmpeg -version | head -1

      - name: Check this runner can actually download
        # The decisive check. yt-dlp's ability to fetch bytes depends on the
        # IP and the yt-dlp version, and GitHub runners are datacenter IPs —
        # exactly what YouTube is most likely to refuse. Running this first
        # means a failure is diagnosed in one legible step instead of looking
        # like a broken pipeline. Non-blocking: see docs/LIMITS.md section 7.
        continue-on-error: true
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.main doctor

      - name: Write YouTube cookies
        # Datacenter IPs trigger YouTube's bot-verification gate. Passing a
        # Netscape-format cookie file from a real browser session (logged in to
        # YouTube) bypasses it. Export the YOUTUBE_COOKIES secret as a file;
        # downloader.py reads YOUTUBE_COOKIES_FILE and passes it to yt-dlp.
        # If the secret is absent this step is a no-op and the download will
        # fail with "Sign in to confirm" — add the secret to fix it.
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            echo "$YOUTUBE_COOKIES" > /tmp/yt-cookies.txt
            echo "YOUTUBE_COOKIES_FILE=/tmp/yt-cookies.txt" >> "$GITHUB_ENV"
            echo "Cookie file written."
          else
            echo "YOUTUBE_COOKIES secret not set — downloads will attempt without cookies."
          fi

      - name: Download and transcribe
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Optional. Absent, transcription falls back to local Whisper,
          # which needs no key and no quota but takes far longer.
          TRANSCRIPTION_API_KEY: ${{ secrets.TRANSCRIPTION_API_KEY }}
          LOG_LEVEL: INFO
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.main download --dry-run
          else
            python -m src.main ingest
          fi

      - name: Write status to the run summary
        if: always()
        run: python -m src.main status

      - name: Commit state
        if: always()
        run: |
          # The database and the transcripts. Media never reaches git — it
          # lives in a temp directory the command removes on exit.
          if git diff --quiet -- data/; then
            echo "no state change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(state): ingest pass $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected, rebasing (attempt $attempt)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "::error::could not push state after 3 attempts"
          exit 1
