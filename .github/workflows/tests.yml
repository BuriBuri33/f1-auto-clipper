name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # ffmpeg is preinstalled on ubuntu runners; the real-audio integration
      # tests skip themselves if it or `say` is missing.
      - run: ffmpeg -version | head -1
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
